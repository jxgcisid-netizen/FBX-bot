version: '3.8'

services:
  discord-bot:
    build: .
    container_name: discord-bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DATABASE_URL=${DATABASE_URL}          # 添加 PostgreSQL 连接字符串
      - GITHUB_TOKEN=${GITHUB_TOKEN}          # 备份用 GitHub Token
      - GITHUB_BACKUP_REPO=${GITHUB_BACKUP_REPO}  # 备份仓库
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # 延长启动等待时间
